name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes anywhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The tests run the TypeScript sources directly, so every version here
        # has to strip types without a flag. 22.18 was the first that does.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Here as well as in the release, because this is where a release PR gets
      # checked. A chart left a version behind passed CI once already.
      - run: npm run check:versions

      - run: npm test

      # The published artefact is the build, so a build that breaks is a
      # release that breaks, and this is where to find that out.
      - run: npm run build

  docker:
    # Named for what it is, because a check called "docker" next to a workflow
    # that does push images reads like a push. This one never does: it builds,
    # boots the container and mints a canvas in it, then throws the image away.
    # `push: true` appears once in this repository, in release.yml.
    name: image (built and smoke-tested, never pushed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: pr-lens-gitlab-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: the image starts and answers
        run: |
          docker run -d --name backend -p 8787:8787 -e STORE=memory pr-lens-gitlab-backend:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/healthz && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8787/api/canvas | tee /dev/stderr | grep -q '"rev":0'
          docker rm -f backend

  chart:
    # Lints and renders the chart, both ways in, so a broken template is a
    # failed check rather than a failed release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - run: helm lint charts/pr-lens-gitlab-backend --strict
          --set config.gitlab.project=group/canvases
          --set secretName=pr-lens-gitlab

      - name: it renders with an ingress
        run: |
          helm template lens charts/pr-lens-gitlab-backend \
            --set config.gitlab.project=group/canvases \
            --set secretName=pr-lens-gitlab \
            --set ingress.enabled=true > /dev/null

      - name: it renders with several ingress hosts
        run: |
          helm template lens charts/pr-lens-gitlab-backend \
            --set config.gitlab.project=group/canvases \
            --set secretName=pr-lens-gitlab \
            --set ingress.enabled=true \
            --set 'ingress.hosts={a.example.com,b.example.com}' \
            | grep -c '^    - host:' | grep -qx 2

      - name: it renders with a Gateway API route
        run: |
          helm template lens charts/pr-lens-gitlab-backend \
            --set config.gitlab.project=group/canvases \
            --set secretName=pr-lens-gitlab \
            --set httpRoute.enabled=true > /dev/null

      - name: it renders with the cache sidecar
        run: |
          helm template lens charts/pr-lens-gitlab-backend \
            --set config.gitlab.project=group/canvases \
            --set secretName=pr-lens-gitlab \
            --set cache.enabled=true > /dev/null

      # VCL is a compiled language, so a typo in it is a crash loop rather than a
      # warning. varnishd -C compiles and throws away, which is the cheapest way
      # to find that out here instead of in a cluster.
      - name: the VCL compiles
        run: |
          docker run --rm \
            -v "$PWD/charts/pr-lens-gitlab-backend/files:/vcl:ro" \
            varnish:9 varnishd -C -f /vcl/default.vcl > /dev/null

      - name: an ingress with no host at all is refused
        run: |
          if helm template lens charts/pr-lens-gitlab-backend \
            --set config.gitlab.project=group/canvases \
            --set secretName=pr-lens-gitlab \
            --set ingress.enabled=true \
            --set ingress.host= > /dev/null 2>&1; then
            echo "the chart should have insisted on a host" >&2
            exit 1
          fi

      - name: a gitlab store without a Secret is refused
        run: |
          if helm template lens charts/pr-lens-gitlab-backend \
            --set config.gitlab.project=group/canvases > /dev/null 2>&1; then
            echo "the chart should have insisted on secretName" >&2
            exit 1
          fi
