name: release

# One tag publishes both: the npm package and the container image. They carry
# the same version on purpose, so "which image is this release" never needs
# looking up.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing v* tag to publish
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: the tag, package.json and the chart all agree
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match package version $version" >&2
            exit 1
          fi
          # The chart's appVersion is what pins the image a release installs, so
          # a chart left behind would deploy the previous version silently.
          chart="$(grep -E '^version:' charts/pr-lens-gitlab-backend/Chart.yaml | awk '{print $2}')"
          app="$(grep -E '^appVersion:' charts/pr-lens-gitlab-backend/Chart.yaml | tr -d '"' | awk '{print $2}')"
          if [ "$chart" != "$version" ] || [ "$app" != "$version" ]; then
            echo "chart $chart / appVersion $app do not match package version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  npm:
    needs: verify
    runs-on: ubuntu-latest
    # Named in npm's trusted publisher for this package, which checks the claim
    # matches. Renaming it here without renaming it there stops publishing.
    environment: release
    permissions:
      contents: read
      # The whole of the credential. npm trades this OIDC token for a
      # short-lived publish token, so there is no NPM_TOKEN to leak or rotate,
      # and the same token is what signs the provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing wants npm 11.5.1 or newer; whatever Node ships with
      # is not a promise, so ask for it.
      - run: npm install -g npm@latest

      - run: npm ci

      # prepare builds, so the tarball holds dist/ and never the sources.
      - run: npm publish --provenance --access public

  container:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.verify.outputs.version }}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    # Pushed after the image, because the chart it publishes names an image tag
    # that has to exist by the time anyone installs it.
    needs: [verify, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: azure/setup-helm@v5

      - name: log in to ghcr
        run: |
          helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}

      - name: package and push
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          helm package charts/pr-lens-gitlab-backend \
            --version "$VERSION" --app-version "$VERSION" --destination dist-chart
          # An OCI registry, so the chart lives beside the image it installs and
          # needs no index.yaml and no gh-pages branch to serve it.
          helm push "dist-chart/pr-lens-gitlab-backend-$VERSION.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: dist-chart/*.tgz
