apiVersion: v1
kind: Service
metadata:
  name: {{ include "pr-lens-gitlab-backend.fullname" . }}
  labels: {{- include "pr-lens-gitlab-backend.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      # Whatever is in front of the pod. With the cache on, the app port is not
      # reachable through this Service at all.
      targetPort: {{ if .Values.cache.enabled }}cache{{ else }}http{{ end }}
      protocol: TCP
      name: http
  selector: {{- include "pr-lens-gitlab-backend.selectorLabels" . | nindent 4 }}
