apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pr-lens-gitlab-backend.fullname" . }}
  labels: {{- include "pr-lens-gitlab-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "pr-lens-gitlab-backend.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pr-lens-gitlab-backend.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      # The server talks to a git remote, never to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Long enough for an in-flight push to reach the remote.
      terminationGracePeriodSeconds: 60
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env: {{- include "pr-lens-gitlab-backend.env" . | nindent 12 }}
          {{- with .Values.secretName }}
          envFrom:
            # GIT_TOKEN lives here, so it is never part of the pod spec.
            # Kubernetes lets the explicit env above win a name clash, so this
            # Secret can add settings but never quietly replace one.
            - secretRef:
                name: {{ . }}
          {{- end }}
          # Liveness asks only whether this process is up. Readiness asks whether
          # the remote is answering, which is what should take a pod out of the
          # Service without restarting it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The only writable path, and where the git mirror lives: the root
            # filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.config.indexMarkdown }}
            - name: index
              mountPath: /etc/pr-lens
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.cache.enabled }}
        # The cache reaches the app over the loopback they share, so the app port
        # is never exposed once this is in front of it.
        - name: cache
          image: "{{ .Values.cache.image.repository }}:{{ .Values.cache.image.tag }}"
          imagePullPolicy: {{ .Values.cache.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          # The image's entrypoint assembles varnishd from these two, and appends
          # anything passed as args.
          env:
            - name: VARNISH_HTTP_PORT
              value: {{ .Values.cache.port | quote }}
            - name: VARNISH_SIZE
              value: {{ .Values.cache.size | quote }}
          args:
            - -l
            - {{ .Values.cache.logSize | quote }}
          ports:
            - name: cache
              containerPort: {{ .Values.cache.port }}
              protocol: TCP
          # Its own probes, on its own port, through to the app behind it. A pod
          # is ready only when every container is, so a wedged cache takes the
          # pod out of the Service rather than serving errors from it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: cache
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: cache
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {{- toYaml .Values.cache.resources | nindent 12 }}
          volumeMounts:
            - name: cache-config
              mountPath: /etc/varnish
              readOnly: true
            - name: cache-workdir
              mountPath: /var/lib/varnish
            - name: cache-tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSize }}
        {{- if .Values.config.indexMarkdown }}
        - name: index
          configMap:
            name: {{ include "pr-lens-gitlab-backend.suffixed" (dict "root" . "suffix" "index") }}
        {{- end }}
        {{- if .Values.cache.enabled }}
        - name: cache-config
          configMap:
            name: {{ include "pr-lens-gitlab-backend.suffixed" (dict "root" . "suffix" "cache") }}
        - name: cache-workdir
          # Memory-backed because varnishd mmaps its shared log here and wants it
          # fast -- which also means this counts against the memory limit.
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.cache.workdirSize }}
        - name: cache-tmp
          emptyDir:
            sizeLimit: 16Mi
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
