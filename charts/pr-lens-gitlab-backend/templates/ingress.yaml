{{- if .Values.ingress.enabled }}
{{- $fullName := include "pr-lens-gitlab-backend.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels: {{- include "pr-lens-gitlab-backend.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # One rule per host, all of them the same rule: an internal name and the
    # canonical one are the same server, and a canvas link is whichever host the
    # reader was given. Which is also why config.publicUrl matters more with two
    # than with one -- without it, a link minted through either names that one.
    {{- range splitList "," (include "pr-lens-gitlab-backend.ingressHosts" .) }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.path }}
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
