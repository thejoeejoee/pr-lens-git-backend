{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "pr-lens-git-backend.fullname" . }}
  labels: {{- include "pr-lens-git-backend.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs: {{- required "httpRoute.parentRefs is required when the route is enabled" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # One rule for everything: the API, the canvas pages and the pictures are
    # all one origin, and the CLI takes a view link's origin as the API.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "pr-lens-git-backend.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
